<!doctype html><html><head><meta charset="utf-8"><script>
// GitHub Pages SPA fallback: pass the path as a query string and redirect to index.html
var p=location.pathname.split('/').slice(2).join('/');
location.replace(location.pathname.split('/').slice(0,2).join('/')+'/?p='+encodeURIComponent(p)+location.hash);
</script></head><body></body></html>
