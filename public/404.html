<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent Economy Observatory</title>
    <script>
      // Routing is hash based, so any 404 here is a genuinely unknown path.
      // Send it to the app root and let the router pick the default view.
      location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
