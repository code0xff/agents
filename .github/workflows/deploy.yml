name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:
  # Called by the snapshot workflow: pushes made with GITHUB_TOKEN do not
  # trigger other workflows, so the snapshot job invokes this one directly.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always publish the tip of dev, not the SHA that triggered the run,
          # so a snapshot commit made moments earlier is included.
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
