name: Refresh data snapshots

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One unreachable source must not discard the others: record the exit code, commit
      # what was collected, and fail the job only after the commit (last step).
      - name: Collect snapshots
        id: collect
        run: |
          set +e
          node scripts/snapshot.mjs
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit snapshots
        id: commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add public/snapshots data/snapshot-state data/bazaar-history.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh data snapshots"
          git pull --rebase origin dev
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Fail on a source error
        if: steps.collect.outputs.code != '0'
        run: |
          echo "::error::snapshot.mjs exited ${{ steps.collect.outputs.code }}; see the Collect snapshots log for the failing source"
          exit 1

  # A GITHUB_TOKEN push does not trigger the push-based deploy, so call it here.
  deploy:
    needs: snapshot
    # always(): a partial failure still commits fresh sources, and those should ship.
    if: always() && needs.snapshot.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
